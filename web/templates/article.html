{{define "main"}}
{{with .Data}}
  <article class="h-entry">
    <header>
      <a class="u-url" href="{{$.Config.SiteURL}}{{.URL}}">
        <h1 class="p-name">{{.Title}}</h1>
      </a>
      <p class="byline">
        <span><a class="p-author h-card p-name u-url" href="{{$.Config.SiteURL}}/">Wesley Cranston</a></span>
        {{if .HasPublished}}<time class="dt-published" datetime="{{datetime .Published}}">{{date .Published}}</time>{{end}}
        <span>{{.ReadingTime}} min read</span>
        {{- with .SyndicationURL}}
        <span><a class="u-syndication" href="{{.}}">Also on Bluesky</a></span>
        {{- end}}
      </p>
      {{template "tags" .Tags}}
    </header>
    <section class="e-content">
      {{.Body}}
    </section>
  </article>
{{end}}
{{end}}
